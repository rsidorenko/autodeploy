name: Autodeploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: posudaotido.ru
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            git clone https://github.com/rsidorenko/autodeploy.git application
            cd ~/application
            echo "Останавливаем старые контейнеры..."
            docker kill backend frontend mongo nginx
            docker system prune -f
            echo "Собираем контейнеры..."
            docker-compose build backend frontend mongo nginx
            echo "Запускаем контейнеры..."
            docker-compose up -d
            echo "Деплой завершён!"
            cd ..
            rm -rf application
